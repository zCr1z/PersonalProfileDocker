apiVersion: apps/v1
kind: Deployment
metadata:
  name: q1-personal-profile

spec:
  replicas: 2

  selector:
    matchLabels:
      app: q1-personal-profile

  template:
    metadata:
      labels:
        app: q1-personal-profile

    spec:
      containers:
        - name: q1-personal-profile
          image: y1rd/q1-personal-profile:latest
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: q1-personal-profile-service

spec:
  type: NodePort

  selector:
    app: q1-personal-profile

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30011
